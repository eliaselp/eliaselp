name: Update profile graphics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/snake_3y.py"
      - ".github/scripts/activity_monthly.py"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate light snake (last 3 years)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/snake_3y.py \
            --user "${{ github.repository_owner }}" \
            --years 3 \
            --theme light \
            --output dist/github-snake.svg

      - name: Generate dark snake (last 3 years)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/snake_3y.py \
            --user "${{ github.repository_owner }}" \
            --years 3 \
            --theme green \
            --output dist/github-snake-dark.svg

      - name: Generate light monthly activity
        env:
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: |
          python3 .github/scripts/activity_monthly.py \
            --user "${{ github.repository_owner }}" \
            --years 3 \
            --theme light \
            --output dist/activity-monthly.svg

      - name: Generate dark monthly activity
        env:
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: |
          python3 .github/scripts/activity_monthly.py \
            --user "${{ github.repository_owner }}" \
            --years 3 \
            --theme dark \
            --output dist/activity-monthly-dark.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
