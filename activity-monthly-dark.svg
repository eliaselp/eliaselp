  <title id="chart-title">Monthly contribution activity for eliaselp</title>
  <desc id="chart-desc">Stacked monthly bars from 2024-01 to 2026-11: public contributions and private commits.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .axis, .month, .year, .legend { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .axis { font-size: 10px; fill: #8b949e; }
    .month { font-size: 9px; fill: #6e7681; }
    .year { font-size: 12px; fill: #e6edf3; font-weight: 600; }
    .legend { font-size: 10px; fill: #8b949e; }
    .title { font-size: 18px; fill: #e6edf3; font-weight: 700; }
    .subtitle { font-size: 11px; fill: #8b949e; }
    .total { font-size: 14px; fill: #e6edf3; font-weight: 600; }
    .total-private { font-size: 11px; fill: #58a6ff; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
